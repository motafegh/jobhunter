[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jobhunter-local"
version = "0.1.0"
description = "Local-first personal career-intelligence application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "instructor>=1.15,<2",
  "jinja2>=3.1,<4",
  "jsonschema>=4.23,<5",
  "openai>=2.49,<3",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.7,<3",
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
jobhunter = "jobhunter.app_entrypoint:main"
jobhunter-app = "jobhunter.web.launcher:main"
jobhunter-review-snapshot = "jobhunter.review_snapshot:main"
jobhunter-corpus = "jobhunter.public_corpus_cli:main"
jobhunter-registry = "jobhunter.canonical_registry_cli:main"
jobhunter-work = "jobhunter.work_intelligence_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobhunter = [
  "data/*.toml",
  "web/templates/*.html",
  "web/static/*.css",
  "web/static/*.js",
  "web/static/*.svg",
  "web/static/*.webmanifest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/jobhunter/inference/instructor_lm_studio_v14.py" = ["I001"]
