name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"

      - name: Smoke installed public entrypoints
        run: |
          jobhunter --version
          jobhunter-corpus status
          jobhunter --config jobhunter.toml.example jobinja plan
          jobhunter-app --help

      - name: Run Ruff
        run: ruff check .

      - name: Run tests
        run: pytest

      - name: Run tests with warnings as errors
        run: pytest -W error
