name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"

      - name: Reveal Ruff import normalization
        run: |
          ruff check tests/test_analysis_v17_candidate.py --fix
          python - <<'PY'
          from pathlib import Path
          text = "\n".join(Path("tests/test_analysis_v17_candidate.py").read_text().splitlines()[:18])
          escaped = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error file=tests/test_analysis_v17_candidate.py::{escaped}")
          raise SystemExit(1)
          PY

      - name: Run tests
        run: pytest

      - name: Run tests with warnings as errors
        run: pytest -W error
